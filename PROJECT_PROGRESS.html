<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omni-Shift v15 — Project Progress</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --dim:#6e7681;
    --blue:#58a6ff; --green:#3fb950; --amber:#d29922; --red:#f85149;
    --orange:#f0883e; --purple:#bc8cff;
    --past:#3d444d; --track:#21262d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 18px 80px}

  /* ---------- masthead ---------- */
  .mast{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px 24px;margin-bottom:22px}
  .mast-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
  h1{font-size:21px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px;margin:0}
  .sub b{color:var(--text);font-weight:600}
  .score{text-align:right;white-space:nowrap}
  .score-num{font-size:38px;font-weight:700;color:var(--green);line-height:1;letter-spacing:-.02em}
  .score-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:4px}
  .scorebar{height:10px;background:var(--track);border-radius:6px;overflow:hidden;margin:18px 0 16px;position:relative}
  .scorebar-fill{height:100%;background:linear-gradient(90deg,#238636,var(--green));border-radius:6px;transition:width .5s ease}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:7px;
    padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
  button:hover{background:#262c36;border-color:#484f58}
  button.on{border-color:var(--blue);color:var(--blue)}

  /* ---------- legend ---------- */
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;padding-top:15px;border-top:1px solid var(--border);
    font-size:11.5px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:6px}
  .swatch{width:16px;height:8px;border-radius:2px;display:inline-block}

  /* ---------- group ---------- */
  .group{margin-bottom:14px}
  .group-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
    margin:26px 0 10px;padding-left:2px;font-weight:600}

  /* ---------- node ---------- */
  details.node{border:none;margin:0}
  details.node>summary{
    list-style:none;cursor:pointer;display:grid;
    grid-template-columns:18px minmax(0,1fr) 92px 128px 54px;
    align-items:center;gap:10px;
    padding:9px 12px;border-radius:8px;border:1px solid transparent;
    transition:background .12s,border-color .12s;
  }
  details.node>summary::-webkit-details-marker{display:none}
  details.node>summary:hover{background:var(--panel);border-color:var(--border)}
  details.node>summary:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  .caret{color:var(--dim);font-size:10px;transition:transform .15s;user-select:none;display:inline-block}
  details[open]>summary>.caret{transform:rotate(90deg)}
  .caret.leaf{visibility:hidden}

  .title{min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .title .t{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node.lvl0 .title .t{font-size:15.5px;font-weight:650}
  .node.lvl1 .title .t{font-size:14.5px}
  .node.lvl2 .title .t{font-size:13.5px;font-weight:450;color:#c9d1d9}
  .id{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:var(--dim)}

  .badge{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;
    border:1px solid;font-weight:700;white-space:nowrap;line-height:1.4}
  .b-locked{color:var(--green);border-color:#238636;background:#12261a}
  .b-complete{color:var(--green);border-color:#238636;background:#12261a}
  .b-progress{color:var(--blue);border-color:#1f6feb;background:#0d1b2e}
  .b-next{color:var(--bg);border-color:var(--blue);background:var(--blue)}
  .b-blocked{color:var(--red);border-color:#8b2b25;background:#2a1214}
  .b-open{color:var(--orange);border-color:#8a4b1d;background:#2a1a0f}
  .b-deferred{color:var(--amber);border-color:#7d5a10;background:#241d0a}
  .b-not-started{color:var(--dim);border-color:#30363d;background:#161b22}
  .b-pending{color:var(--purple);border-color:#5c3d99;background:#1a1229}

  /* ---------- bar ---------- */
  .barwrap{position:relative;height:20px;display:flex;align-items:center}
  .bar{position:relative;height:9px;width:100%;background:var(--track);border-radius:5px;overflow:visible}
  .bar-past{position:absolute;left:0;top:0;height:100%;background:var(--past);border-radius:5px 0 0 5px}
  .bar-new{position:absolute;top:0;height:100%;border-radius:0 5px 5px 0}
  .bar-solo{position:absolute;left:0;top:0;height:100%;border-radius:5px}
  .tick{position:absolute;top:-3px;width:2px;height:15px;background:#6e7681;border-radius:1px;opacity:.75}
  .tick:hover{background:var(--text);opacity:1}
  .tick::after{
    content:attr(data-tip);position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
    background:#010409;border:1px solid var(--border);color:var(--text);font-size:10.5px;
    padding:3px 7px;border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:20}
  .tick:hover::after{opacity:1}
  .pct{font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px;text-align:right}
  .pct.full{color:var(--green)}
  .pct.zero{color:var(--dim);font-weight:500}
  .pct.mid{color:var(--blue)}

  /* ---------- meta line ---------- */
  .meta{grid-column:2 / -1;display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--dim);
    margin-top:-3px;padding-bottom:2px}
  .meta .hist{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted)}
  .meta .delta{color:var(--green);font-weight:700}
  .note{grid-column:2 / -1;font-size:12.5px;color:var(--muted);padding:2px 0 4px;max-width:78ch}

  .children{margin-left:26px;padding-left:14px;border-left:1px solid var(--border)}

  /* ---------- footer ---------- */
  .foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--border);
    font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  @media (max-width:760px){
    .wrap{padding:16px 10px 60px}
    details.node>summary{grid-template-columns:16px minmax(0,1fr) 46px;grid-template-areas:"c t p" ". b b";row-gap:6px}
    .caret{grid-area:c}.title{grid-area:t}.pct{grid-area:p}
    .barwrap{grid-area:b;height:14px}
    .meta,.note{grid-column:1/-1}
    .children{margin-left:12px;padding-left:10px}
    .score-num{font-size:30px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="mast">
    <div class="mast-top">
      <div>
        <h1 id="pj-title">—</h1>
        <p class="sub" id="pj-sub"></p>
      </div>
      <div class="score">
        <div class="score-num" id="score-num">—</div>
        <div class="score-lbl" id="score-lbl">overall</div>
      </div>
    </div>
    <div class="scorebar"><div class="scorebar-fill" id="scorebar-fill" style="width:0%"></div></div>
    <div class="controls">
      <button id="btn-expand">Expand all</button>
      <button id="btn-collapse">Collapse all</button>
      <button id="btn-sort" class="on">Sort: recent first</button>
      <button id="btn-full">Show complete only</button>
    </div>
    <div class="legend">
      <span><i class="swatch" style="background:#3d444d"></i> already done before this report</span>
      <span><i class="swatch" style="background:#58a6ff"></i> added since last report</span>
      <span><i class="swatch" style="background:#3fb950"></i> complete</span>
      <span><i class="swatch" style="background:#6e7681;width:2px;height:14px"></i> past checkpoint (hover)</span>
    </div>
  </div>

  <main id="root"></main>

  <div class="foot">
    <span id="foot-gen"></span>
    <span>Rendered from embedded JSON · edit only the <code>&lt;script id="data"&gt;</code> block</span>
  </div>

</div>

<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var root = document.getElementById('root');

  var STATUS_LABEL = {
    'locked':'locked','complete':'complete','in-progress':'in progress','next':'next',
    'blocked':'blocked','open':'open','deferred':'deferred','not-started':'not started','pending':'pending'
  };

  var sortMode = 'recent';
  var showCompleteOnly = false;

  /* ---------- helpers ---------- */
  function num(v){ return typeof v === 'number' ? v : null; }
  function clamp(v){ return Math.max(0, Math.min(100, v)); }

  // rollup: explicit pct wins, else mean of children
  function effectivePct(node){
    if (num(node.pct) !== null) return clamp(node.pct);
    if (node.children && node.children.length){
      var sum = 0, n = 0;
      node.children.forEach(function(c){ sum += effectivePct(c); n++; });
      return n ? Math.round(sum / n) : 0;
    }
    return 0;
  }

  function newestChildDate(node){
    var best = node.lastTouched || '';
    (node.children || []).forEach(function(c){
      var d = newestChildDate(c);
      if (d > best) best = d;
    });
    return best;
  }

  function historyOf(node){
    var h = (node.history || []).slice();
    if (!h.length) return h;
    h.sort(function(a,b){ return (a.date||'') < (b.date||'') ? -1 : 1; });
    return h;
  }

  function prevPct(node){
    var h = historyOf(node);
    if (h.length < 2) return null;
    return clamp(h[h.length-2].pct);
  }

  function colorFor(pct, status){
    if (pct >= 100) return 'var(--green)';
    if (status === 'blocked') return 'var(--red)';
    if (status === 'open') return 'var(--orange)';
    if (status === 'deferred') return 'var(--amber)';
    if (pct === 0) return '#484f58';
    return 'var(--blue)';
  }

  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined && txt !== null) e.textContent = txt;
    return e;
  }

  /* ---------- bar ---------- */
  function buildBar(node, pct){
    var wrap = el('div','barwrap');
    var bar = el('div','bar');

    // ticks for each historical checkpoint
    var h = historyOf(node);
    var seen = 0;
    h.forEach(function(pt){
      var p = clamp(pt.pct);
      if (p === 0 || p === seen) return;
      seen = p;
      var t = el('div','tick');
      t.style.left = 'calc(' + p + '% - 1px)';
      t.setAttribute('data-tip', (pt.date || '') + ' · ' + p + '%' + (pt.note ? ' — ' + pt.note : ''));
      bar.appendChild(t);
    });

    var prev = prevPct(node);
    var col = colorFor(pct, node.status);

    if (prev !== null && prev > 0 && prev < pct && pct < 100){
      var past = el('div','bar-past'); past.style.width = prev + '%'; bar.appendChild(past);
      var nu = el('div','bar-new');
      nu.style.left = prev + '%'; nu.style.width = (pct - prev) + '%';
      nu.style.background = col; bar.appendChild(nu);
    } else {
      var solo = el('div','bar-solo');
      solo.style.width = pct + '%';
      solo.style.background = col;
      bar.appendChild(solo);
    }

    wrap.appendChild(bar);
    return wrap;
  }

  /* ---------- node ---------- */
  function renderNode(node, level){
    var pct = Math.round(effectivePct(node));
    var hasKids = !!(node.children && node.children.length);

    if (showCompleteOnly && pct < 100 && !hasIncompleteDescendant(node)) return null;

    var d = el('details','node lvl' + level);
    d.open = true;

    var s = el('summary','row');

    var caret = el('span','caret' + (hasKids ? '' : ' leaf'), '▶');
    s.appendChild(caret);

    var title = el('div','title');
    if (node.id) title.appendChild(el('span','id', node.id));
    title.appendChild(el('span','t', node.title || ''));
    if (node.status && STATUS_LABEL[node.status]){
      var cls = node.next ? 'b-next' : ('b-' + node.status.replace(/\s+/g,'-'));
      title.appendChild(el('span','badge ' + cls, STATUS_LABEL[node.status]));
    }
    s.appendChild(title);

    s.appendChild(buildBar(node, pct));

    var p = el('div','pct ' + (pct >= 100 ? 'full' : pct === 0 ? 'zero' : 'mid'), pct + '%');
    s.appendChild(p);

    // meta line
    var meta = el('div','meta');
    if (node.lastTouched) meta.appendChild(el('span','', 'last touched ' + node.lastTouched));
    var h = historyOf(node);
    if (h.length > 1){
      var strip = h.map(function(x){ return x.pct; }).join(' → ');
      meta.appendChild(el('span','hist', strip + ' %'));
      var prev = prevPct(node);
      if (prev !== null && pct > prev){
        meta.appendChild(el('span','delta','+' + (pct - prev) + ' since last report'));
      }
    }
    if (meta.childNodes.length) s.appendChild(meta);

    if (node.note) s.appendChild(el('div','note', node.note));

    d.appendChild(s);

    if (hasKids){
      var kids = node.children.slice();
      kids = sortKids(kids);
      var box = el('div','children');
      kids.forEach(function(c){
        var rendered = renderNode(c, Math.min(level + 1, 2));
        if (rendered) box.appendChild(rendered);
      });
      if (box.childNodes.length) d.appendChild(box);
    }
    return d;
  }

  function hasIncompleteDescendant(node){
    if (Math.round(effectivePct(node)) < 100) return true;
    return false;
  }

  function sortKids(kids){
    if (sortMode === 'recent'){
      return kids.slice().sort(function(a,b){
        var da = newestChildDate(a), db = newestChildDate(b);
        if (db !== da) return db < da ? -1 : 1;
        return 0;
      });
    }
    return kids.slice().sort(function(a,b){
      return String(a.id).localeCompare(String(b.id), undefined, {numeric:true});
    });
  }

  /* ---------- render ---------- */
  function render(){
    var m = DATA.meta || {};
    document.getElementById('pj-title').textContent = m.project || 'Project';
    var subBits = [];
    if (m.series) subBits.push(m.series);
    if (m.tag) subBits.push(m.tag);
    if (m.commit) subBits.push(m.commit);
    if (m.strikes) subBits.push('strikes ' + m.strikes);
    var sub = document.getElementById('pj-sub');
    sub.innerHTML = '';
    subBits.forEach(function(b, i){
      if (i) sub.appendChild(document.createTextNode(' · '));
      sub.appendChild(el('b','', b));
    });

    var score = typeof m.score === 'number' ? m.score : 0;
    document.getElementById('score-num').textContent = score + '%';
    document.getElementById('score-lbl').textContent = m.scoreLabel || 'overall';
    document.getElementById('scorebar-fill').style.width = score + '%';
    document.getElementById('foot-gen').textContent = 'Generated ' + (m.generated || '—') + (m.note ? ' · ' + m.note : '');

    root.innerHTML = '';
    (DATA.groups || []).forEach(function(g){
      var wrap = el('div','group');
      wrap.appendChild(el('div','group-h', g.name || ''));
      var items = sortKids(g.items || []);
      var any = false;
      items.forEach(function(it){
        var node = renderNode(it, 0);
        if (node){ wrap.appendChild(node); any = true; }
      });
      if (any) root.appendChild(wrap);
    });

    if (!root.childNodes.length){
      root.appendChild(el('p','sub','Nothing to show at this filter.'));
    }
  }

  /* ---------- controls ---------- */
  document.getElementById('btn-expand').addEventListener('click', function(){
    document.querySelectorAll('details.node').forEach(function(d){ d.open = true; });
  });
  document.getElementById('btn-collapse').addEventListener('click', function(){
    document.querySelectorAll('details.node').forEach(function(d){ d.open = false; });
  });
  var sortBtn = document.getElementById('btn-sort');
  sortBtn.addEventListener('click', function(){
    sortMode = sortMode === 'recent' ? 'sequence' : 'recent';
    sortBtn.textContent = 'Sort: ' + (sortMode === 'recent' ? 'recent first' : 'plan order');
    sortBtn.classList.toggle('on', sortMode === 'recent');
    render();
  });
  var fullBtn = document.getElementById('btn-full');
  fullBtn.addEventListener('click', function(){
    showCompleteOnly = !showCompleteOnly;
    fullBtn.classList.toggle('on', showCompleteOnly);
    fullBtn.textContent = showCompleteOnly ? 'Show everything' : 'Show incomplete only';
    render();
  });

  render();
})();
</script>
